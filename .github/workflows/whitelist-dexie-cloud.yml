name: Whitelist Dexie Cloud Origin

on:
  repository_dispatch:
    types:
      - 'vercel.deployment.ready'
      - 'vercel.deployment.success'
  workflow_dispatch:
    inputs:
      url:
        description: 'Origin URL to whitelist (e.g. https://example.vercel.app)'
        required: true

jobs:
  whitelist:
    runs-on: ubuntu-latest
    if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Dexie Cloud credentials
        run: |
          echo '${{ secrets.DEXIE_CLOUD_JSON }}' > dexie-cloud.json
          echo '${{ secrets.DEXIE_CLOUD_KEY }}' > dexie-cloud.key

      - name: Whitelist origin
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "${{ github.event.client_payload.url }}" ]; then
            URL="${{ github.event.client_payload.url }}"
          else
            URL="${{ github.event.inputs.url }}"
          fi
          # Ensure URL has protocol prefix
          if [[ ! "$URL" =~ ^https?:// ]]; then
            URL="https://$URL"
          fi
          # Extract hostname and port, stripping protocol
          RAW_HOST=$(echo "$URL" | sed -E 's|^https?://||')
          HOSTNAME=$(echo "$RAW_HOST" | cut -d: -f1)

          PR_ALIAS=""
          if [ -n "$VERCEL_TOKEN" ]; then
            PR_ALIAS=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$HOSTNAME" \
              | jq -r '.meta.branchAlias // empty' 2>/dev/null || true)
          fi

          if [ -n "$PR_ALIAS" ]; then
            echo "Whitelisting PR alias: https://$PR_ALIAS"
            npx dexie-cloud whitelist "https://$PR_ALIAS"
          fi

          echo "Whitelisting target origin: $URL"
          npx dexie-cloud whitelist "$URL"
